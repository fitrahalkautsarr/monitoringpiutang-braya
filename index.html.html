<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monitoring Piutang – PT Biringkassi Raya</title>
<style>
:root{--bg:#dbdbdb;--cd:#fff;--tx:#141414;--mu:#54555a;--bd:#d4d4d4;--in:#f1f1f1;--rd:#7c0000;--r2:#970606;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1020;--cd:#121b30;--tx:#e8edf6;--mu:#9fb0c8;--bd:#263653;--in:#1a2742;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1020;--cd:#121b30;--tx:#e8edf6;--mu:#9fb0c8;--bd:#263653;--in:#1a2742;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{font:14px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#lg{display:grid;grid-template-columns:1fr 1.7fr;height:100%;background:var(--cd)}.lf{background:linear-gradient(#0000 40%,#7c0000cc),var(--im) center/cover;color:#fff;padding:28px;display:flex;flex-direction:column;gap:6px}.lf img{width:56px}.lf h2{margin:70px 0 0}.rt{display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:auto;gap:12px;width:100%;padding:20px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:7px 8px;font:inherit}
.b,.b2{background:var(--rd);color:#fff;border:0;border-radius:4px;padding:8px 12px;font:600 13px inherit;cursor:pointer;display:inline-block}.b2{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
#app{display:grid;grid-template:64px 1fr/240px 1fr;height:100%}#top{grid-column:1/3;background:var(--cd);box-shadow:0 2px 6px #0003;display:flex;align-items:center;gap:14px;padding:0 18px;z-index:2}#top img{height:44px}#top .sr{flex:1;max-width:640px;margin:auto;border-radius:18px}
.av{background:var(--r2);color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}
#side{background:#000;color:#fff;display:flex;flex-direction:column;overflow:hidden}#side a{padding:10px 18px;cursor:pointer;display:block;white-space:nowrap}#side a.on{background:var(--r2)}#side img{margin-top:auto;width:100%}
#main{overflow:auto;padding:14px}h2{margin:0 0 4px;font-size:24px}h2 em{color:var(--r2);font-style:normal}h4{margin:0 0 8px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.bn{background:linear-gradient(90deg,#000a,#0000),var(--im) center/cover;color:#fff;border-radius:12px;padding:26px 30px;min-height:130px}.bn h2{color:#fff}.bn em{color:#ff4040}
.fl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:12px 0}.fl label{display:flex;flex-direction:column;font-size:12px;gap:3px}
.ks{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:12px;margin:12px 0}.k{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:12px;position:relative;overflow:hidden;min-height:100px}.k b{display:block;font-size:13px}.k strong{display:block;font-size:19px;margin:8px 0 4px}.k small{color:var(--mu);position:relative;z-index:1}
.k:after{content:"";position:absolute;right:0;bottom:0;width:50%;height:45%;background:linear-gradient(135deg,#0000,#5ccb1a66);clip-path:polygon(0 100%,30% 50%,55% 75%,100% 0,100% 100%)}.k.bd:after{background:linear-gradient(135deg,#0000,#e6000066)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.ks.sm .k{padding:10px 8px}.ks.sm .k b{font-size:12px}.ks.sm .k strong{font-size:clamp(11px,1.05vw,15px);white-space:nowrap}.ks.sm .k small{font-size:11px}.cd{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:14px}.cw{height:260px;position:relative}.em{text-align:center;color:var(--mu);padding:30px}
.tw{overflow:auto;max-height:430px;background:var(--cd);border:1px solid var(--bd)}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th{background:var(--rd);color:#fff;position:sticky;top:0;padding:9px 10px;text-align:left}td{padding:8px 10px;border-bottom:1px solid var(--bd)}
.pg{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0;font-size:13px}.pg button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:4px;min-width:30px;padding:5px;margin:0 2px;cursor:pointer}.pg .on{background:var(--rd);color:#fff}.pg i{margin:0 4px}
.ln{color:var(--r2);cursor:pointer;text-decoration:underline;margin-right:6px}.lp{display:grid;grid-template-columns:1fr;gap:12px}.lp:has(aside){grid-template-columns:1fr 360px}.lp>div{min-width:0}
.dp{position:relative}.dp .x{position:absolute;right:10px;top:10px}.bx{border:1px solid var(--bd);border-radius:6px;padding:10px;margin:10px 0}.bx p{display:flex;justify-content:space-between;gap:8px;margin:6px 0}mark{background:#ffd9d9;color:#900;padding:0 4px}.dp img{width:100%;margin-top:8px}
.x{background:none;border:0;color:inherit;font-size:18px;cursor:pointer;float:right}#md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9}.mc{background:var(--cd);width:min(1100px,94vw);max-height:90vh;overflow:auto;border-radius:10px;padding:20px}.mc .tw{max-height:55vh}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fm label{display:flex;flex-direction:column;gap:3px;font-size:12px}.er{color:#e60000;margin:6px 0}#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:6px;z-index:10}
@media(max-width:860px){#app{grid-template:56px auto 1fr/1fr}#side{flex-direction:row;overflow:auto}#side img{display:none}.g2,.lp:has(aside){grid-template-columns:1fr}.ks{grid-template-columns:1fr 1fr}#lg{grid-template-columns:1fr}.lf{display:none}.fm{grid-template-columns:1fr}}
@media print{#app{display:block}#side,#top,.nopr,.fl,.pg,#md,#ts{display:none!important}.tw{max-height:none!important;overflow:visible!important}#main{overflow:visible}:root{--bg:#fff;--cd:#fff;--tx:#000;--bd:#ccc}}
</style></head><body>
